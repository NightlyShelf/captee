name: Plan validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  plan-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate planning artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f openspec/config.yaml
          mapfile -t active_changes < <(
            find openspec/changes \
              -mindepth 1 -maxdepth 1 -type d ! -name archive \
              -printf '%f\n' | sort
          )
          test "${#active_changes[@]}" -gt 0
          for change in "${active_changes[@]}"; do
            test -f "openspec/changes/${change}/proposal.md"
            test -f "openspec/changes/${change}/design.md"
            test -f "openspec/changes/${change}/tasks.md"
            test "$(find "openspec/changes/${change}/specs" -name spec.md -type f | wc -l)" -gt 0
          done
          if rg -n '^(<<<<<<<|=======|>>>>>>>)' . --glob '!*.lock'; then
            echo 'Merge-conflict markers found.' >&2
            exit 1
          fi
