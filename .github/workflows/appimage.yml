name: AppImage package

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  CARGO_TERM_COLOR: always
  CAPTEE_ALLOW_RUNNER_FALLBACK: "true"
  CAPTEE_BUILD_IMAGE: ${{ vars.CAPTEE_BUILD_IMAGE }}
  CAPTEE_APPIMAGE_BUILD_DIR: .ci/appimage
  GHCR_USERNAME: ${{ github.actor }}
  GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  appimage:
    name: Ubuntu 22.04 x86_64 AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Prepare build environment
        run: ci/images/prepare-environment.sh build
      - name: Build AppImage
        env:
          CAPTEE_APPIMAGE_BUILD_DIR: .ci/appimage
        run: ci/images/run-in-environment.sh ./packaging/appimage/build.sh
      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: captee-appimage-x86_64
          path: .ci/appimage/*.AppImage
          if-no-files-found: error
