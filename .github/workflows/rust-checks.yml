name: Rust checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  CARGO_TERM_COLOR: always
  CAPTEE_ALLOW_RUNNER_FALLBACK: "true"
  CAPTEE_TEST_IMAGE: ${{ vars.CAPTEE_TEST_IMAGE }}
  GHCR_USERNAME: ${{ github.actor }}
  GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Prepare test environment
        run: ci/images/prepare-environment.sh test
      - name: Run rustfmt
        run: ci/images/run-in-environment.sh cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Prepare test environment
        run: ci/images/prepare-environment.sh test
      - name: Run clippy
        run: ci/images/run-in-environment.sh cargo clippy --workspace --all-targets --all-features -- -D warnings

  workspace-tests:
    name: headless workspace tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Prepare test environment
        run: ci/images/prepare-environment.sh test
      - name: Run workspace tests
        run: ci/images/run-in-environment.sh cargo test --workspace

  ui-state:
    name: headless UI state tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Prepare test environment
        run: ci/images/prepare-environment.sh test
      - name: Run UI state tests
        run: ci/images/run-in-environment.sh cargo test -p captee-ui
