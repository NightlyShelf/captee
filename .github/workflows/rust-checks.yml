name: Rust checks

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  CARGO_TERM_COLOR: always
  CAPTEE_ALLOW_RUNNER_FALLBACK: "true"
  CAPTEE_TEST_IMAGE: ${{ vars.CAPTEE_TEST_IMAGE }}
  GHCR_USERNAME: ${{ github.actor }}
  GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  rust:
    name: rustfmt, clippy, and tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Prepare test environment
        run: ci/images/prepare-environment.sh test
      - name: Run rustfmt
        run: ci/images/run-in-environment.sh cargo fmt --all -- --check
      - name: Run clippy
        run: ci/images/run-in-environment.sh cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Run workspace tests
        run: ci/images/run-in-environment.sh cargo test --workspace

  dependencies:
    name: dependency policy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
