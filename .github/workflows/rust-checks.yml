name: Rust checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy
      - name: Install GTK build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libgtk-4-dev libgtksourceview-5-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  workspace-tests:
    name: headless workspace tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - name: Install GTK build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libgtk-4-dev libgtksourceview-5-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  ui-state:
    name: headless UI state tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - name: Install GTK build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libgtk-4-dev libgtksourceview-5-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p captee-ui
