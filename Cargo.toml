[workspace]
members = [
  "crates/captee-core",
  "crates/captee-platform",
  "crates/captee-ui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/NightlyShelf/captee"

[workspace.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "screenshot"] }
async-io = "2.6"
png = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"

[workspace.lints.rust]
unsafe_code = "forbid"
